<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <title>Κάμερα και Κύβος</title>
    <script src="gl-matrix-min.js"></script>
    <script src="webgl-debug.js"></script>
    <link rel="stylesheet" href="style.css">


    <script id="vShader" type="x-shader/x-vertex">
attribute vec4 aVertexPosition;
attribute vec4 aVertexColor;
uniform mat4 uVerticesTransform;
varying vec4 vColor;
void main(void) {
    gl_Position = uVerticesTransform * aVertexPosition;
    vColor = aVertexColor;
}
</script>

    <script id="fShader" type="x-shader/x-fragment">
precision mediump float;
varying vec4 vColor;
void main(void) {
    gl_FragColor = vColor;
}
</script>

    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #222;
        }

        .controls {
            max-width: 500px;
            margin: 20px auto;
        }
    </style>

    <script>
        let gl, canvas, shadersProgram;
        let vertexBuffer, colorBuffer;
        let vertexPositionAttributePointer, vertexColorAttributePointer, verticesTransformUniformPointer;

        function createGLContext(canvas) {
            return canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        }

        function createCompileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                alert("Shader error: " + gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        function initShaders() {
            const vsSource = document.getElementById("vShader").textContent;
            const fsSource = document.getElementById("fShader").textContent;
            const vs = createCompileShader(gl.VERTEX_SHADER, vsSource);
            const fs = createCompileShader(gl.FRAGMENT_SHADER, fsSource);

            shadersProgram = gl.createProgram();
            gl.attachShader(shadersProgram, vs);
            gl.attachShader(shadersProgram, fs);
            gl.linkProgram(shadersProgram);
            if (!gl.getProgramParameter(shadersProgram, gl.LINK_STATUS)) {
                alert("Shader linking failed.");
            }

            gl.useProgram(shadersProgram);
            vertexPositionAttributePointer = gl.getAttribLocation(shadersProgram, "aVertexPosition");
            gl.enableVertexAttribArray(vertexPositionAttributePointer);
            vertexColorAttributePointer = gl.getAttribLocation(shadersProgram, "aVertexColor");
            gl.enableVertexAttribArray(vertexColorAttributePointer);
            verticesTransformUniformPointer = gl.getUniformLocation(shadersProgram, "uVerticesTransform");
        }

        function initBuffers() {
            const vertices = new Float32Array([
                // Front (red)
                -0.5, -0.5, 0.5, 1, 0.5, -0.5, 0.5, 1, 0.5, 0.5, 0.5, 1,
                -0.5, -0.5, 0.5, 1, 0.5, 0.5, 0.5, 1, -0.5, 0.5, 0.5, 1,
                // Back (green)
                -0.5, -0.5, -0.5, 1, -0.5, 0.5, -0.5, 1, 0.5, 0.5, -0.5, 1,
                -0.5, -0.5, -0.5, 1, 0.5, 0.5, -0.5, 1, 0.5, -0.5, -0.5, 1,
                // Top (blue)
                -0.5, 0.5, -0.5, 1, -0.5, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1,
                -0.5, 0.5, -0.5, 1, 0.5, 0.5, 0.5, 1, 0.5, 0.5, -0.5, 1,
                // Bottom (yellow)
                -0.5, -0.5, -0.5, 1, 0.5, -0.5, -0.5, 1, 0.5, -0.5, 0.5, 1,
                -0.5, -0.5, -0.5, 1, 0.5, -0.5, 0.5, 1, -0.5, -0.5, 0.5, 1,
                // Right (cyan)
                0.5, -0.5, -0.5, 1, 0.5, 0.5, -0.5, 1, 0.5, 0.5, 0.5, 1,
                0.5, -0.5, -0.5, 1, 0.5, 0.5, 0.5, 1, 0.5, -0.5, 0.5, 1,
                // Left (magenta)
                -0.5, -0.5, -0.5, 1, -0.5, -0.5, 0.5, 1, -0.5, 0.5, 0.5, 1,
                -0.5, -0.5, -0.5, 1, -0.5, 0.5, 0.5, 1, -0.5, 0.5, -0.5, 1,
            ]);

            const colors = new Float32Array([
                ...Array(6).fill([1, 0, 0, 1]).flat(),
                ...Array(6).fill([0, 1, 0, 1]).flat(),
                ...Array(6).fill([0, 0, 1, 1]).flat(),
                ...Array(6).fill([1, 1, 0, 1]).flat(),
                ...Array(6).fill([0, 1, 1, 1]).flat(),
                ...Array(6).fill([1, 0, 1, 1]).flat()
            ]);

            vertexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

            colorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);
        }

        function getCameraPosition() {
            const dist = parseFloat(document.getElementById("camOrthoDistance").value);
            const selected = document.querySelector("input[name='camPos']:checked");
            const map = {
                "LFT": [-1, -1, 1], "LFB": [-1, -1, -1], "LBT": [-1, 1, 1], "LBB": [-1, 1, -1],
                "RFT": [1, -1, 1], "RFB": [1, -1, -1], "RBT": [1, 1, 1], "RBB": [1, 1, -1]
            };
            const dir = map[selected.value];
            return dir.map(v => v * dist);
        }

        function drawScene() {
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

            const viewMatrix = glMatrix.mat4.create();
            const projectionMatrix = glMatrix.mat4.create();
            const finalMatrix = glMatrix.mat4.create();

            const camPos = getCameraPosition();
            glMatrix.mat4.lookAt(viewMatrix, camPos, [0, 0, 0], [0, 0, 1]);

            const fov = parseFloat(document.getElementById("viewAngle").value) * Math.PI / 180;
            const camDistance = parseFloat(document.getElementById("camOrthoDistance").value);
            const zFar = camDistance * 10;
            glMatrix.mat4.perspective(projectionMatrix, fov, 1, 0.001, zFar);
            glMatrix.mat4.multiply(finalMatrix, projectionMatrix, viewMatrix);

            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            gl.vertexAttribPointer(vertexPositionAttributePointer, 4, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(vertexColorAttributePointer, 4, gl.FLOAT, false, 0, 0);
            gl.uniformMatrix4fv(verticesTransformUniformPointer, false, finalMatrix);

            gl.drawArrays(gl.TRIANGLES, 0, 36);
        }

        function main() {
            canvas = document.getElementById("sceneCanvas");
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            canvas.width = minDim * 0.9;
            canvas.height = minDim * 0.9;

            gl = WebGLDebugUtils.makeDebugContext(createGLContext(canvas));
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            gl.clearColor(0.1, 0.1, 0.1, 1);
            gl.enable(gl.DEPTH_TEST);

            initShaders();
            initBuffers();
            drawScene();
        }
    </script>
</head>

<body onload="main()">
    <div class="container">
        <canvas id="sceneCanvas"></canvas>

        <div class="controls">
            <label>Γωνία θέασης (μοίρες):<br>
                <input type="number" id="viewAngle" value="60" onchange="drawScene()">
            </label><br><br>

            <label>Απόσταση κάμερας:<br>
                <input type="number" id="camOrthoDistance" value="8" onchange="drawScene()">
            </label><br><br>

            <fieldset>
                <legend>Επιλογή Θέσης Κάμερας:</legend>
                <label><input type="radio" name="camPos" value="LFT" checked>
                    Left-Front-Top</label><br>
                <label><input type="radio" name="camPos" value="LFB">
                    Left-Front-Bottom</label><br>
                <label><input type="radio" name="camPos" value="LBT"> Left-Back-Top</label><br>
                <label><input type="radio" name="camPos" value="LBB">
                    Left-Back-Bottom</label><br>
                <label><input type="radio" name="camPos" value="RFT"> Right-Front-Top</label><br>
                <label><input type="radio" name="camPos" value="RFB">
                    Right-Front-Bottom</label><br>
                <label><input type="radio" name="camPos" value="RBT"> Right-Back-Top</label><br>
                <label><input type="radio" name="camPos" value="RBB"> Right-Back-Bottom</label>
            </fieldset>
            <br>
            <button onclick="drawScene()">Επανασχεδίαση</button>

        </div>
    </div>
</body>

</html>
